name: Android APK

# Builds the arm64 APK the same way as docs/android/BUILDING.md: on Windows
# with Git Bash, NDK r29, the bundled Turnip driver and the stripped
# (~50 MB) libraries. The APK is uploaded as a workflow artifact and, by
# default, attached to a GitHub pre-release (download it on the phone).
#
# Signing (the same scheme as the hakuX fork, with this repository's own
# key): the repository secret
# DEBUG_KEYSTORE_B64 (a debug keystore, base64; store and key password
# "android", alias androiddebugkey) signs every build with the same key, so
# each one installs over the last. A build without it, or whose certificate
# isn't DEBUG_CERT_SHA256, fails: a throwaway key's APK can't update the one
# installed, and the reinstall it takes deletes the installed game and saves.
# By default the native code targets the Snapdragon 8 Gen 3 (ANDROID_CPU=
# sm8650, see build_native.sh); that APK does not start on ARMv8.2 chips.

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'README*'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Native build type'
        type: choice
        options: [RelWithDebInfo, Release]
        default: RelWithDebInfo
      android_cpu:
        description: 'CPU target: sm8650 = Snapdragon 8 Gen 3 / Galaxy S24 (ARMv8.6), generic = every ARMv8.2 device'
        type: choice
        options: [sm8650, generic]
        default: sm8650
      release:
        description: 'Attach the APK to a GitHub pre-release'
        type: boolean
        default: true
      strip:
        description: 'Strip native libraries (smaller APK, no symbols for crash backtraces)'
        type: boolean
        default: true

permissions:
  contents: write   # the pre-release

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VER: 29.0.14206865
  # The debug key's certificate (SHA-256): keytool -list -v -keystore
  # debug.keystore -storepass android (the one in DEBUG_KEYSTORE_B64). This
  # repository's own key, generated for it; not the hakuX fork's.
  DEBUG_CERT_SHA256: E33DBC07390E84B4558F84F6D3BCAA9EFB6AE7C316F69B38BAF3149A204403A1
  BUILD_TYPE: ${{ inputs.build_type || 'RelWithDebInfo' }}
  # Tuned for the Galaxy S24+ (Snapdragon 8 Gen 3) unless chosen otherwise.
  ANDROID_CPU: ${{ inputs.android_cpu || 'sm8650' }}
  STRIP: ${{ (github.event_name == 'workflow_dispatch' && !inputs.strip && '0') || '1' }}

jobs:
  apk:
    name: Build APK (arm64-v8a)
    runs-on: windows-latest
    # The first native build compiles ~90 very large generated sources.
    timeout-minutes: 350

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install CMake and Ninja
        run: python -m pip install "cmake==3.31.6" "ninja==1.11.1.4"

      - name: Install Android SDK platform and NDK
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          "y`n" * 20 | & $sdkmanager --licenses | Out-Null
          & $sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;$env:NDK_VER" | Select-Object -Last 5

      # The build scripts expect Git Bash style paths (as env.sh derives them
      # on a developer machine), not C:\... ones.
      - name: Export POSIX tool paths
        run: |
          echo "ANDROID_HOME=$(cygpath -u "$ANDROID_HOME")" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$(cygpath -u "$ANDROID_HOME")" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$(cygpath -u "$ANDROID_HOME")/ndk/$NDK_VER" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$(cygpath -u "$JAVA_HOME")" >> "$GITHUB_ENV"

      - name: Show toolchain versions
        run: |
          python --version
          cmake --version | head -1
          ninja --version
          "$JAVA_HOME/bin/java" -version 2>&1 | head -1
          ls "$ANDROID_NDK" | head -3

      # Checked before the long native build, so a missing key fails early.
      - name: Signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            msg="No DEBUG_KEYSTORE_B64 secret: the APK would get a throwaway key and not install over the last build. Add the secret (the debug keystore, base64) under Settings > Secrets and variables > Actions."
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::error::$msg"
              exit 1
            fi
            # A push still compiles and packages, as a check of the change,
            # but its throwaway-key APK is not published anywhere.
            echo "::warning::$msg This run only checks that the build works; no APK is published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          ks="$(cygpath -m "$RUNNER_TEMP")/debug.keystore"
          echo "$KEYSTORE" | base64 -d > "$ks"
          got=$("$JAVA_HOME/bin/keytool" -list -v -keystore "$ks" -storepass android -alias androiddebugkey |
            sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':\r' | head -n 1)
          if [ "$got" != "$DEBUG_CERT_SHA256" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 holds another key (certificate SHA-256 $got, expected $DEBUG_CERT_SHA256)."
            exit 1
          fi
          # Named to Gradle (os/android/app/build.gradle.kts): the default
          # debug keystore is not reliably the one a runner signs with.
          echo "LIBERTY_DEBUG_KEYSTORE=$ks" >> "$GITHUB_ENV"
          echo "Signing with the repository's debug key (certificate SHA-256 $got)."

      - name: Prepare pinned dependencies and patches
        run: python tools/setup_repo.py

      - name: Build Vulkan driver proxy
        run: bash os/android/scripts/build_driver_proxy.sh

      - name: Build native libraries
        # Default jobs = CPUs - 2; the generated sources need a lot of memory each.
        run: bash os/android/scripts/build_native.sh

      - name: Package APK
        run: |
          rm -f os/android/app/build/outputs/apk/debug/app-debug.apk
          bash os/android/scripts/build_apk.sh debug

      - name: Name the APK
        id: name
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName *= *"\(.*\)".*/\1/p' os/android/app/build.gradle.kts)
          branch="${GITHUB_REF_NAME//\//-}"
          name="LibertyRecompAndroid-${version}-${ANDROID_CPU}-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          cp os/android/app/build/outputs/apk/debug/app-debug.apk "$name"
          # Every signer's certificate must be the debug key's.
          jar="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)lib/apksigner.jar"
          out=$("$JAVA_HOME/bin/java" -jar "$(cygpath -m "$jar")" verify --print-certs "$name" | tr -d '\r')
          got=$(echo "$out" | sed -n 's/^.*certificate SHA-256 digest: //p' | tr 'a-f' 'A-F' | sort -u)
          if [ "$got" != "$DEBUG_CERT_SHA256" ]; then
            echo "$out"
            echo "::error::$name is signed with certificate SHA-256 '$got', not the debug key's $DEBUG_CERT_SHA256."
            exit 1
          fi
          echo "$name: signed with the debug key ($got)"
          ls -la "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=build-${branch}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Keep as the run's artifact
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ steps.name.outputs.name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Pre-release
        if: steps.signing.outputs.signed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.name.outputs.tag }}" "${{ steps.name.outputs.name }}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "LibertyRecomp Android: ${GITHUB_REF_NAME} #${GITHUB_RUN_NUMBER} (${ANDROID_CPU})" \
            --notes "Build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}, CPU target \`${ANDROID_CPU}\`. Signed with the repository's debug key: installs over earlier builds from this workflow. Coming from another signer's build (the original releases), uninstall once first; that deletes the installed game and saves."
